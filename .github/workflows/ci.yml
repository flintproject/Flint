name: CI

on: [push, pull_request]

jobs:
  build-on-ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build
        run: nix build -L
      - name: Read a symlink
        run: echo "UPLOAD_PATH=$(readlink -f result)" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: result-on-ubuntu-latest
          path: ${{ env.UPLOAD_PATH }}
  build-on-macos-latest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build
        run: nix build -L
      - name: Read a symlink
        run: echo "UPLOAD_PATH=$(readlink -f result)" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: result-on-macos-latest
          path: ${{ env.UPLOAD_PATH }}
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          xcode-select -p
          clang --version
          xcodebuild -version
      - name: Cache downloaded dependencies
        uses: actions/cache@v6
        with:
          path: source/xcode/src
          key: macos-xcode-${{ hashFiles('source/xcode/Makefile', 'source/version.mk', 'source/deposit.mk') }}
          restore-keys: macos-xcode-
      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config bzip2 make
      - name: Configure
        run: cd source/xcode && cp config.mk.github config.mk
      - name: Build (Xcode + pkgbuild/productbuild/hdiutil)
        run: cd source/xcode && gmake
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Flint.dmg
          path: source/xcode/Flint-*.dmg
  build-on-windows-2022:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Cache downloaded dependencies
        uses: actions/cache@v6
        with:
          path: source/msvc/src
          key: windows-msvc-${{ hashFiles('source/msvc/Makefile', 'source/version.mk', 'source/deposit.mk') }}
          restore-keys: windows-msvc-
      - name: Install MSYS2 packages
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm --needed base-devel coreutils wget tar gzip bzip2 xz unzip patch m4 sed p7zip"
      - name: Configure (download dependencies, generate all.proj)
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "cd ${GITHUB_WORKSPACE//\\//}/source/msvc && cp config.mk.x86-64 config.mk && make"
      - name: Build (MSVC + WiX)
        shell: cmd
        run: |
          set "VSWHERE=C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          set "PATH=C:\Program Files (x86)\WiX Toolset v3.14\bin;%PATH%"
          cd /d "%GITHUB_WORKSPACE%\source\msvc"
          msbuild all.proj /m /fl
      - name: Verify the resources of flint.exe
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet pefile
          python .github/scripts/verify_pe_resources.py source/msvc/flint/flint.exe
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: flint.msi
          path: source/msvc/flint/flint.msi
